<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Vulnerable Search</title>
		<style>
			body {
				font: 16px system-ui;
				background: #fff4f1;
				padding: 40px;
				max-width: 780px;
				margin: auto;
			}

			main {
				background: white;
				padding: 30px;
				border-radius: 14px;
			}

			input {
				padding: 10px;
				width: 65%;
			}

			button {
				padding: 10px;
			}

			a {
				color: #165ca6;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Vulnerable Search</h1>
			<p>Demonstration only: this page incorrectly marks user-controlled input as safe HTML.</p>
			<form method="get" action="/vulnerable">
				<input name="q" placeholder="Enter a search term" value="{{ query }}">
				<button type="submit">Search</button>
			</form>
			<h2>Search results for:</h2>
			<div id="output">{{ query | safe }}</div>
			<p>
				<a href="/secure">Compare secure version</a>
				·
				<a href="/">Home</a>
			</p>
		</main>
	</body>
</html>
